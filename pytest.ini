[pytest]
# Los tests de ejemplos/ (incluido ejemplos/regresion/) son los de las tareas del
# estudiante: fallan a propósito mientras no se programa el archivo de cada tarea
# (neurona.py, regresion.py). Solo los corre ejecutar_tests, uno por uno.
norecursedirs = .* venv build dist *.egg ejemplos
# Los tests viven en tests/; pythonpath = . permite que importen los módulos
# de la raíz (estado, server, fuentes...) como antes.
testpaths = tests
pythonpath = .
